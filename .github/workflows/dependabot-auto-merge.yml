name: Dependabot auto-merge

# Hardened on purpose — read before loosening:
# - `pull_request`, not `pull_request_target`: the token never gets write
#   access in the context of a fork PR, and Dependabot PRs get exactly the
#   job-level permissions below.
# - GitHub-hosted runner: this is a public repo, so nothing triggered by a PR
#   may run on the self-hosted machine. The job never checks out code.
# - Gate on the PR author, not `github.actor`: the actor is whoever triggered
#   the event (a re-run, a rebase), which is not proof the PR came from
#   Dependabot. The literal repo name is deliberate: this repo is itself a
#   fork, so `head.repo.fork` can't tell "ours" from "someone else's".
# - No auto-approve, and the merge step is opt-in: it only runs when the repo
#   variable DEPENDABOT_AUTOMERGE is 'true'. Set it ONLY after enabling
#   "Allow auto-merge" AND a ruleset on main that requires the test/typecheck/
#   dco checks. Without required checks the PR is already "clean" and
#   `gh pr merge --auto` merges it on the spot, with no gate at all.
on:
  pull_request:

permissions: {}

jobs:
  auto-merge:
    if: >-
      github.repository == 'LittleGuava/agf' &&
      github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Enable auto-merge
        if: >-
          vars.DEPENDABOT_AUTOMERGE == 'true' &&
          (steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
          steps.metadata.outputs.update-type == 'version-update:semver-minor')
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
