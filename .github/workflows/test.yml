name: test

# Runs on GitHub-hosted runners on purpose: this repo is public and the
# `pull_request` trigger runs code from fork PRs. Nothing PR-triggered may run
# on the self-hosted machine — keep self-hosted for release/packaging only.
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  changes:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      src: ${{ steps.filter.outputs.src }}
      ci: ${{ steps.filter.outputs.ci }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Detect changes
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        id: filter
        with:
          filters: |
            src:
              - 'src/**'
              - 'package.json'
              - 'tsconfig.json'
            ci:
              - '.github/workflows/**'
              - '.github/actions/**'

  test:
    name: test (Node ${{ matrix.node-version }})
    needs: changes
    if: ${{ needs.changes.outputs.src == 'true' || needs.changes.outputs.ci == 'true' }}
    strategy:
      fail-fast: true
      matrix:
        # Linux only for now — the OS matrix stays collapsed (see native-install).
        # Keep the Node-major matrix; setup-node switches versions on the runner.
        node-version: [20, 22]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Bun (version from package.json packageManager)
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Configure node-gyp (Windows)
        if: runner.os == 'Windows'
        run: npm install -g node-gyp

      # Keyed by Node major: better-sqlite3 is a native addon with a per-ABI
      # binary, so node_modules from Node 20 must never be restored on Node 22.
      # No prefix restore-keys — a stale tree from an older lockfile is worse
      # than a cold install.
      - name: Cache node_modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node${{ matrix.node-version }}-${{ hashFiles('bun.lock') }}

      - name: Pre-build native deps (Windows)
        if: runner.os == 'Windows'
        run: npm install better-sqlite3 --build-from-source --legacy-peer-deps

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run CI checks (typecheck + lint + test:blast)
        run: bun run ci:smoke

      - name: Run test:blast (changed files)
        if: github.event_name == 'pull_request'
        run: bun run test:blast
      # No junit report step: nothing here emits junit.xml, and the report
      # action posted a green "test results" check even when no test ran.
      # Re-add it together with a vitest junit reporter and require_tests: true.

  # Validates the `npm install` path — `npm ci` + better-sqlite3 built from
  # source — which the main `test` job (bun) does not exercise. Linux only.
  #
  # Coverage gap: the Windows native-build leg (tracked as node_1135de15f1da).
  # Now that the repo is public, hosted windows-latest is free and could close it.
  native-install:
    name: native (Linux, Node 22)
    needs: changes
    if: ${{ needs.changes.outputs.src == 'true' || needs.changes.outputs.ci == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Node.js 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          # `npm ci` wipes node_modules, so cache the npm download cache instead.
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies (npm, builds native better-sqlite3)
        run: npm ci

      - name: Run tests (native binary validation)
        run: npm test

  coverage:
    needs: [changes, test]
    if: ${{ needs.changes.outputs.src == 'true' || needs.changes.outputs.ci == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Bun (version from package.json packageManager)
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Setup Node.js 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22

      - name: Cache node_modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node22-${{ hashFiles('bun.lock') }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run coverage + quality gate
        run: bun run test:all

      - name: Architecture fitness gate
        # Threshold: current baseline 75%. Epic "Fix Architecture Fitness → 100%" tracks the climb.
        run: npx tsx src/cli/index.ts harness --gate --threshold 75

      - name: Quality gate — evaluateProjectQuality
        run: |
          npx tsx -e "
            const { evaluateProjectQuality } = require('./src/core/harness/project-quality.ts');
            const { collectSrcFiles } = require('./src/core/harness/collect-src.ts');
            const files = collectSrcFiles(process.cwd());
            const result = evaluateProjectQuality(files);
            if (!result.gate.passed) {
              console.error('QUALITY GATE FAILED:', JSON.stringify(result.gate.failures, null, 2));
              process.exit(1);
            }
            console.log('Quality gate passed:', JSON.stringify({ testScore: result.testScore, logScore: result.logScore }, null, 2));
          "

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: coverage/

  gatherer:
    needs: [changes, test]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Check test results
        run: |
          if [[ "${{ needs.test.result }}" != "success" ]]; then
            echo "Test job failed or was skipped"
            exit 1
          fi
          echo "All checks passed"
